# Weekly dependency PRs. Expo packages are grouped because the SDK pins them to one another;
# updating them one at a time produces PRs that expo-doctor rejects.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
    # react and react-dom are held at one version by pnpm.overrides and move only with the Expo SDK.
    ignore:
      - dependency-name: react
      - dependency-name: react-dom
    groups:
      expo:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*", "@react-native*/*"]
      fastify:
        patterns: ["fastify", "@fastify/*"]
      dev:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: monthly }
