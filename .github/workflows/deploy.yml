name: Deploy (server)

# CD: on a published GitHub Release, build the web + api images and roll them
# out to k3s (deploys straight from GitHub). Also runnable manually.
# The desktop release pipeline (release.yml) runs independently on the same event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build & deploy (defaults to latest)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build & push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"   # lowercase
          TAG="${{ github.event.release.tag_name || inputs.tag || 'latest' }}"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kidase-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kidase-api:latest

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kidase-web:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kidase-web:latest

  deploy:
    name: Apply manifests & roll out (k3s)
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        env:
          KC: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret as base64 OR raw kubeconfig.
          if printf '%s' "$KC" | base64 -d > "$HOME/.kube/config" 2>/dev/null && grep -q '^apiVersion' "$HOME/.kube/config"; then
            echo "Decoded base64 kubeconfig"
          else
            printf '%s' "$KC" > "$HOME/.kube/config"
            echo "Used raw kubeconfig"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # Idempotent: creates the resources on first run, updates them after.
      # (kubectl + kustomize are preinstalled on ubuntu runners.)
      - name: Apply manifests with release image tags
        env:
          OWNER: ${{ needs.images.outputs.owner }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          cd deploy/k8s
          kustomize edit set image \
            kidase-api=ghcr.io/$OWNER/kidase-api:$TAG \
            kidase-web=ghcr.io/$OWNER/kidase-web:$TAG
          kubectl apply -k .
          kubectl -n kidase rollout status deployment/kidase-api --timeout=120s
          kubectl -n kidase rollout status deployment/kidase-web --timeout=120s
