name: Deploy (server)

# CD: on a published GitHub Release, build the web + api images and roll them
# out to k3s (deploys straight from GitHub). Also runnable manually.
# The desktop release pipeline (release.yml) runs independently on the same event.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to build & deploy (defaults to the commit SHA)
        required: false
      skip_build:
        description: Deploy an existing tag without rebuilding (rollback)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  # Resolved once so a rollback (skip_build) and a normal run share the same naming.
  # Images carry the release tag, the short commit SHA and latest; the SHA is what gets deployed.
  meta:
    name: Resolve image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER@L}" >> "$GITHUB_OUTPUT"   # lowercase
          TAG="${{ github.event.release.tag_name || inputs.tag || github.sha }}"
          echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  images:
    name: Build & push images
    needs: meta
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/kidase-api:${{ needs.meta.outputs.tag }}
            ghcr.io/${{ needs.meta.outputs.owner }}/kidase-api:${{ needs.meta.outputs.sha }}
            ghcr.io/${{ needs.meta.outputs.owner }}/kidase-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ needs.meta.outputs.owner }}/kidase-web:${{ needs.meta.outputs.tag }}
            ghcr.io/${{ needs.meta.outputs.owner }}/kidase-web:${{ needs.meta.outputs.sha }}
            ghcr.io/${{ needs.meta.outputs.owner }}/kidase-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Apply manifests & roll out (k3s)
    needs: [meta, images]
    # Runs after a successful build, or straight away on a skip_build rollback.
    if: ${{ always() && needs.meta.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kidase.org
    steps:
      - uses: actions/checkout@v7

      - name: Configure kubectl
        env:
          KC: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          # Accept the secret as base64 OR raw kubeconfig.
          if printf '%s' "$KC" | base64 -d > "$HOME/.kube/config" 2>/dev/null && grep -q '^apiVersion' "$HOME/.kube/config"; then
            echo "Decoded base64 kubeconfig"
          else
            printf '%s' "$KC" > "$HOME/.kube/config"
            echo "Used raw kubeconfig"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context

      # Idempotent: creates the resources on first run, updates them after.
      # (kubectl + kustomize are preinstalled on ubuntu runners.)
      - name: Apply manifests with release image tags
        env:
          OWNER: ${{ needs.meta.outputs.owner }}
          # A rollback names the tag to deploy explicitly; a normal run deploys the immutable SHA tag.
          TAG: ${{ inputs.skip_build && needs.meta.outputs.tag || needs.meta.outputs.sha }}
        run: |
          cd deploy/k8s
          kustomize edit set image \
            kidase-api=ghcr.io/$OWNER/kidase-api:$TAG \
            kidase-web=ghcr.io/$OWNER/kidase-web:$TAG
          kubectl apply -k .
          kubectl -n kidase rollout status deployment/kidase-api --timeout=120s
          kubectl -n kidase rollout status deployment/kidase-web --timeout=120s
