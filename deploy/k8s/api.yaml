apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidase-api
  namespace: kidase
spec:
  replicas: 1
  selector:
    matchLabels: { app: kidase-api }
  template:
    metadata:
      labels: { app: kidase-api }
    spec:
      containers:
        - name: api
          # Image name is rewritten by Kustomize (see kustomization.yaml).
          image: kidase-api
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef: { name: kidase-api }
          env:
            - name: PORT
              value: "3001"
          readinessProbe:
            httpGet: { path: /api/v1/health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: kidase-api
  namespace: kidase
spec:
  selector: { app: kidase-api }
  ports:
    - port: 3001
      targetPort: 3001
