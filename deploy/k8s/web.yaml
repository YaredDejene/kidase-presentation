apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidase-web
  namespace: kidase
spec:
  replicas: 1
  selector:
    matchLabels: { app: kidase-web }
  template:
    metadata:
      labels: { app: kidase-web }
    spec:
      containers:
        - name: web
          # Image name is rewritten by Kustomize (see kustomization.yaml).
          image: kidase-web
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: { cpu: "10m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: kidase-web
  namespace: kidase
spec:
  selector: { app: kidase-web }
  ports:
    - port: 80
      targetPort: 80
