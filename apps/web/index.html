        <h1>Kidase Presentation · ቅዳሴ</h1>
        <p>Ethiopian and Eritrean Orthodox Tewahedo liturgy slides for church projection, with the daily Gitsawe (ግፃዌ) readings selected automatically from the Ethiopian calendar date.</p>
        <p>Show up to four languages side by side: Ge'ez (ግዕዝ), Amharic (አማርኛ), Tigrinya (ትግርኛ) and English. Supports Mehella (ምህላ) mode and prayers for Ethiopia and Eritrea. Download any day's Kidase as PDF or PowerPoint.</p>
        <p lang="am">የኢትዮጵያና የኤርትራ ኦርቶዶክስ ተዋሕዶ ቤተ ክርስቲያን የቅዳሴ ስላይዶች፤ የዕለቱ የግፃዌ ምንባባት በግዕዝ፣ በአማርኛ፣ በትግርኛና በእንግሊዝኛ።</p>
        <p>Also spelled Qidase, Qiddase or Kedase (Metsehafe Kidase, መጽሐፈ ቅዳሴ). Includes the Ordo Communis (ሥርዓተ ቅዳሴ) and the fourteen anaphoras:</p>
        <ul>
          <li>Anaphora of the Apostles (ዘሐዋርያት)</li>
          <li>Anaphora of Our Lord (ዘእግዚእነ)</li>
          <li>Anaphora of Our Lady Mary, Kidase Mariam (ዘእግዝእትነ, ቅዳሴ ማርያም)</li>
          <li>Anaphora of St. John, Son of Thunder (ወልደ ነጎድጓድ)</li>
          <li>Anaphora of the 318 Fathers (ዘሰለስቱ ምዕት)</li>
          <li>Anaphora of St. Athanasius (ዘአትናቴዎስ)</li>
          <li>Anaphora of St. Basil (ዘባስልዮስ)</li>
          <li>Anaphora of St. Gregory (ዘጎርጎርዮስ)</li>
          <li>Second Anaphora of St. Gregory (ዘጎርጎርዮስ ካልዕ)</li>
          <li>Anaphora of St. Epiphanius (ዘኤጲፋንዮስ)</li>
          <li>Anaphora of St. John Chrysostom (ዮሐንስ አፈወርቅ)</li>
          <li>Anaphora of St. Cyril (ዘቄርሎስ)</li>
          <li>Anaphora of Jacob of Serugh (ያዕቆብ ዘስሩግ)</li>
          <li>Anaphora of St. Dioscorus (ዘዲዮስቆሮስ)</li>
        </ul>
        <p lang="om">Islaayidii Qiddaasee Waldaa Ortodoksii Tewaahidoo Itoophiyaa fi Eertiraa, dubbisa Gitsawee guyyaa guyyaan waliin.</p>
        <p lang="rw">Amashusho ya Liturujiya (Kidase) ya Kiliziya ya Orotodogisi Tewahedo ya Etiyopiya na Eritereya, hamwe n’amasomo ya buri munsi.</p>
        <p lang="sv">Bilder för Kidase, den etiopiska och eritreanska ortodoxa Tewahedo-liturgin, med dagens Gitsawe-läsningar. Ladda ner som PDF eller PowerPoint.</p>
