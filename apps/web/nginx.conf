server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml image/x-icon;
  gzip_min_length 256;

  # Long-cache hashed assets.
  # ^~ keeps the image rule below from overriding this for hashed files.
  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Unhashed images and fonts in public/ (favicons, logos, og-image). Cache audits want
  # about 90 days; a changed logo should get a new filename to roll out sooner.
  location ~* \.(png|svg|ico|jpg|webp|ttf|woff2)$ {
    expires 90d;
    try_files $uri =404;
  }

  # SPA fallback. Always revalidate so a deploy reaches browsers immediately
  # (without this, browsers heuristically cache index.html and keep the old bundle).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
