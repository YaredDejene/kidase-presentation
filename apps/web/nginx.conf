server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Long-cache hashed assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback. Always revalidate so a deploy reaches browsers immediately
  # (without this, browsers heuristically cache index.html and keep the old bundle).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
