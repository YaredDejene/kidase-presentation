# Optional local MongoDB for development.
#   docker compose -f apps/api/docker-compose.yml up -d
# Then set MONGODB_URI=mongodb://localhost:27017 in apps/api/.env
services:
  mongo:
    image: mongo:7
    container_name: kidase-mongo
    ports:
      - "27017:27017"
    volumes:
      - kidase_mongo_data:/data/db

volumes:
  kidase_mongo_data:
